# The staging copy of the site at https://staging.richthofen.io, on DigitalOcean App Platform
# (free static-site tier). It rebuilds on every push to the staging branch.
# Update after editing: doctl apps update <app id> --spec .do/app.yaml
name: richthofen-staging
region: sfo
static_sites:
  - name: site
    github:
      repo: jazzplato/jazzplato.github.io
      branch: staging
      deploy_on_push: true
    build_command: bundle exec jekyll build --config _config.yml,_config.staging.yml
    output_dir: _site
    error_document: 404.html
domains:
  - domain: staging.richthofen.io
    type: PRIMARY
    zone: richthofen.io
