# Design v3 (site/ built with SITE_THEME=v3) at https://maian.richthofen.io, on DigitalOcean App
# Platform (free static-site tier), built from the next branch like ../.do/next.yaml.
# It clones the public repo, so a push does not redeploy: run
#   doctl apps create-deployment <app id>
# Update after editing: doctl apps update <app id> --spec .do/v3.yaml
name: richthofen-v3
region: sfo
static_sites:
  - name: site
    git:
      repo_clone_url: https://github.com/jazzplato/jazzplato.github.io.git
      branch: next
    environment_slug: node-js
    build_command: cd site && npm ci --no-audit --no-fund && npm run build
    output_dir: site/dist
    error_document: 404.html
    envs:
      - key: SITE_THEME
        value: v3
        scope: BUILD_TIME
domains:
  - domain: maian.richthofen.io
    type: PRIMARY
    zone: richthofen.io
