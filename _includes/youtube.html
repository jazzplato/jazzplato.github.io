{% comment %}
Responsive YouTube embed. Usage: {% include youtube.html id="VIDEO_ID" title="Video title" %}
{% endcomment %}
<div class="video-embed" style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin: 1.5em 0;">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ include.id }}" title="{{ include.title }}" loading="lazy" allowfullscreen style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;"></iframe>
</div>
