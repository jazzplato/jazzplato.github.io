# Site settings
title: Richthofen
SEOTitle: Richthofen's Blog
header-img: img/background/bg-index.webp
email: ricthofenus@gmail.com
description: "Code | Theatre"
keyword: "Jianqiao, Richthofen, jazzplato"
lang: en # default <html lang>; override per page with `lang:` front matter
url: "https://richthofen.io" # your host, for absolute URL
baseurl: "" # for example, '/blog' if your blog hosted on 'host/blog'

# Publish posts or collection documents with a future date.
future: true

# SNS settings
RSS: true
douban_username: ALSVIA
github_username: jazzplato
linkedin_username: liujianqiao

# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
highlighter: rouge
permalink: pretty
paginate: 10
exclude:
    [
        "less",
        "node_modules",
        "Gruntfile.js",
        "package.json",
        "package-lock.json",
        "Rakefile",
        "Gemfile",
        "Gemfile.lock",
        "README.md",
        "README.zh.md",
        "canary/shots",
    ]
anchorjs: true # if you want to customize anchor. check out line:181 of `post.html`
# If you have timezone issue (e.g. #68) in China, uncomment to use this:
#timezone: CN

# Gems
# from PR#40, to support local preview for Jekyll 3.0
# make sure you have this gem installed
# `$ gem install jekyll-paginate`
plugins: [jekyll-paginate]

# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
kramdown:
    input: GFM # use Github Flavored Markdown !important
    syntax_highlighter_opts:
        span:
            line_numbers: false
        block:
            line_numbers: true
            start_line: 1

# Disqus settings (comments load only after the reader clicks "Show comments")
disqus_username: jazzplato

# Analytics settings
# GoatCounter (cookie-free, no consent banner needed): https://www.goatcounter.com
# Sign up, then set this to your site code, e.g. `richthofen` for richthofen.goatcounter.com.
# Leave empty to disable analytics.
goatcounter:

# The new design, in test at /canary/ (only the home page so far; source in canary/).
# share: the part of visitors (0 to 1) whose home page is the new one, e.g. 0.2 for one in five.
# 0 keeps it opt-in: ?ui=canary on any page switches a visitor over, ?ui=classic back, ?ui=reset forgets.
canary:
    share: 0

# Sidebar settings
sidebar: true # whether or not using Sidebar.
sidebar-about-description: "God's in his <b>Heaven</b><br>All's rights with the <b>World</b>"
sidebar-avatar: /img/avatar-nasa.jpg # use absolute URL, seeing it's used in both `/` and `/about/`

# Featured Tags
featured-tags: true # whether or not using Feature-Tags
featured-condition-size: 1 # A tag will be featured if the size of it is more than this condition value

# Progressive Web Apps
chrome-tab-theme-color: "#000000"

# MathJax rendering for layout:page (e.g. post preview)
page-mathjax: false
# Friends
# friends: [] # As if I have any

# Front matter defaults
# Chinese-language sections; production pages stay `en`.
defaults:
    - scope:
          path: "_posts/movie"
      values:
          lang: zh-Hans
    - scope:
          path: "_posts/random"
      values:
          lang: zh-Hans
    - scope:
          path: "_posts/theatre/reviews"
      values:
          lang: zh-Hans
